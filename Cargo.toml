[workspace]
resolver = "3"
members = ["app", "crates/*"]

# Audio DSP (Opus, RNNoise, resampling) is far too slow unoptimized; keep dependencies fast in debug builds.
[profile.dev.package."*"]
opt-level = 2

# Panics still unwind: one in a background task (tokio, songbird) is contained instead of closing the app.
[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
