[package]
name = "bardo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bardo-core = { version = "0.1.0", path = "../crates/core" }
keyring-core = "1.0.1"
# The process-wide crypto provider for reqwest, installed by main().
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
raw-window-handle = "0.6.2"
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows-native-keyring-store = "1.1.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"
