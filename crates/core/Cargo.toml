[package]
name = "bardo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bardo-api = { version = "0.2.1", path = "../api" }
bardo-audio = { version = "0.2.1", path = "../audio" }
bardo-gateway = { version = "0.2.1", path = "../gateway" }
bardo-voice = { version = "0.2.1", path = "../voice" }
rtrb = "0.4.0"
tokio = { version = "1.53.3", features = ["fs", "rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
serde_json = "1.0.154"
